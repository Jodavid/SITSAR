url: https://jodavid.github.io/SITSAR/
destination: docs

template:
  bootstrap: 5
  bslib:
    primary: "#0E7490"
    navbar-bg: "#0E2242"
    link-color: "#0E7490"
    code-color: "#7C3AED"

home:
  title: "SITSAR: Information Theory, Geometry and Statistics for SAR Data"
  sidebar:
    structure: [links, license, citation, authors, dev]

navbar:
  bg: dark
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fa-github
      href: https://github.com/jodavid/SITSAR
      aria-label: GitHub

articles:
  - title: Articles
    navbar: ~
    contents:
      - SITSAR
      - tidymodels

reference:
  - title: Package overview
    contents:
      - SITSAR-package
  - title: Intensity distributions
    desc: Univariate models for SAR intensities.
    contents:
      - dg0i
      - dgammasar
      - dggamma
  - title: Matrix (PolSAR) distributions
